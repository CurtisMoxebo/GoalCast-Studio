version: '3.8'

services:
  mariadb:
    image: mariadb:11.4
    container_name: goalcast-mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: goalcast_db
      MYSQL_USER: goalcast_user
      MYSQL_PASSWORD: goalcast_pass
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: goalcast-backend
    restart: unless-stopped
    depends_on:
      - mariadb
    ports:
      - "${PORT:-8006}:${PORT:-8006}"
    environment:
      PORT: ${PORT:-8006}
      NODE_ENV: production
      DATABASE_URL: "mysql://goalcast_user:goalcast_pass@mariadb:3306/goalcast_db"
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      DEFAULT_TTS_VOICE: hearth
    volumes:
      - ./resources:/resources:ro

volumes:
  mariadb_data:
