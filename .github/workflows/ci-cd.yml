name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-build:
    name: Build Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --onnxruntime-node-install-cuda=skip

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build TypeScript
        run: npm run build

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --onnxruntime-node-install-cuda=skip

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Unit & Regression Tests
        run: npm test

  mobile-build:
    name: Build Mobile App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Mobile App
        run: npm run build

  mobile-test:
    name: Mobile App Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Mobile Regression Tests
        run: npm test

  build-docker:
    name: Build Backend Docker Image
    needs: [backend-build, backend-test, mobile-build, mobile-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: goalcast-backend:${{ github.sha }}

  deploy:
    name: Deploy to Windows Server 2022 (Docker)
    needs: [build-docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load Server Environment File
        run: |
          if (Test-Path "C:\actions-runner\GoalCast-Studio\production.env") {
            Write-Host "Loading environment from C:\actions-runner\GoalCast-Studio\production.env..."
            Copy-Item -Path "C:\actions-runner\GoalCast-Studio\production.env" -Destination ".env" -Force
            Copy-Item -Path "C:\actions-runner\GoalCast-Studio\production.env" -Destination "backend\.env" -Force
          } elseif (Test-Path "C:\actions-runner\GoalCast-Studio\.env") {
            Write-Host "Loading environment from C:\actions-runner\GoalCast-Studio\.env..."
            Copy-Item -Path "C:\actions-runner\GoalCast-Studio\.env" -Destination ".env" -Force
            Copy-Item -Path "C:\actions-runner\GoalCast-Studio\.env" -Destination "backend\.env" -Force
          } elseif (Test-Path ".env") {
            Write-Host "Using existing workspace .env file..."
          } else {
            Write-Error "CRITICAL: No environment file found on server! Please create C:\actions-runner\GoalCast-Studio\production.env with your GEMINI_API_KEY."
            exit 1
          }

      - name: Deploy with Docker Compose
        run: |
          $env:COMPOSE_CONVERT_WINDOWS_PATHS = "1"
          if (-not (Test-Path "resources")) {
            New-Item -ItemType Directory -Force -Path "resources" | Out-Null
          }
          if (Test-Path "C:\actions-runner\GoalCast-Studio\resources") {
            Write-Host "Copying resources from C:\actions-runner\GoalCast-Studio\resources..."
            Copy-Item -Path "C:\actions-runner\GoalCast-Studio\resources\*" -Destination "resources" -Recurse -Force -ErrorAction SilentlyContinue
          }
          Write-Host "Deploying Docker containers..."
          docker compose down --remove-orphans
          docker compose up -d --build
          Write-Host "Waiting for database to be ready..."
          $retry = 0
          while ($retry -lt 15) {
            Start-Sleep -Seconds 2
            $res = docker compose exec -T mariadb mariadb-admin ping -u root -prootpassword 2>&1
            if ($res -like "*alive*") {
              Write-Host "Database is ready!"
              break
            }
            $retry++
          }
          docker compose exec -T backend npx prisma db push --skip-generate
          docker compose ps
